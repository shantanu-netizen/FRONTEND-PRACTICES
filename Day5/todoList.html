<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Todo List</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  display: flex;
  justify-content: center;
  margin-top: 50px;
}

.todo-container {
  background: white;
  padding: 20px;
  width: 300px;
  border-radius: 8px;
}

input {
  width: 70%;
  padding: 6px;
}

button {
  padding: 6px 10px;
  cursor: pointer;
}

ul {
  list-style: none;
  padding: 0;
}

li {
  margin: 8px 0;
  display: flex;
  justify-content: space-between;
}
    </style>
</head>

<body>

    <div class="todo-container">
        <h2>Todo List</h2>

        <input type="text" id="todoInput" placeholder="Enter a task">
        <button onclick="addTodo()">Add</button>

        <ul id="todoList"></ul>
    </div>

    <script src="todo1.js"></script>
</body>

</html>
