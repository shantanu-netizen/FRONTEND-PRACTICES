        }

            position: relative;
            display: inline-block;
        }
         .blue{
            height: 200px;
            width: 200px;
            background-color: blue;
            position: relative;
           display: inline-block;
        }
         .green{
            height: 200px;

            position: relative;
            display: inline-block;
            
        }
    </style>
</head>
<body>

        <div class="red"></div>
        <div  class="green"></div>
